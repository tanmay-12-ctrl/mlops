[testenv]
# This section tells tox to install your dependencies before running tests.
deps = 
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/requirements_dev.txt

# These are the commands that will be run.
commands = 
    # flake8 for code style checks
    flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
    flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    # mypy for type linting
    mypy src/
    
    # pytest for running your specific test files
    pytest -v tests/unit/unit.py
    pytest -v tests/integration/int.py